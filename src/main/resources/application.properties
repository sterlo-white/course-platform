
spring.application.name=course-platform

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/main_service_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/course-platform
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/course-platform/protocol/openid-connect/certs

server.port=8080
keycloak.server-url=http://keycloak:8080
keycloak.realm=course-platform
keycloak.client-id=course-platform-client

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web=DEBUG

keycloak.admin-realm=master
keycloak.admin-client-id=admin-cli
keycloak.admin-username=${KEYCLOAK_ADMIN_USERNAME}
keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD}