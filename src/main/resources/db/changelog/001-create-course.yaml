databaseChangeLog:

  - changeSet:
      id: 001-create-courses
      author: developer

      changes:
        - createTable:
            tableName: courses

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: TEXT

              - column:
                  name: created_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
