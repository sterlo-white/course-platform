databaseChangeLog:
  - changeSet:
      id: 002-create-chapters
      author: developer
      changes:
        - createTable:
            tableName: chapters
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: TEXT

              - column:
                  name: "order"
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: course_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: created_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_time
                  type: TIMESTAMP

        - addForeignKeyConstraint:
            baseTableName: chapters
            baseColumnNames: course_id
            referencedTableName: courses
            referencedColumnNames: id
            constraintName: fk_chapter_course
            onDelete: CASCADE
